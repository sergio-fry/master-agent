# Runtime volumes for SQLite and known_hosts.
# SSH private keys are stored inline in SQLite — no secrets volume required.
#
# Before first start:
#   1. Build known_hosts for StrictHostKeyChecking=yes, e.g.:
#        ssh-keyscan -H worker.example.com >> ./ssh/known_hosts
#   2. Register projects via Web UI or CLI with inline SSH private key material.
#
# HTTP API (Web UI milestone):
#   - Port 8080 is published when daemon runs with --http-addr (default command).
#   - Set ADMIN_USERNAME + ADMIN_PASSWORD when exposing HTTP beyond a trusted network.
#   - Optional MASTER_AGENT_TOKEN for Bearer API clients; optional SESSION_SECRET / SESSION_TTL.

services:
  master-agent:
    build: .
    image: master-agent:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TICK_INTERVAL: "30s"
      # Uncomment when HTTP is reachable outside localhost:
      # ADMIN_USERNAME: "admin"
      # ADMIN_PASSWORD: "change-me"
      # SESSION_SECRET: "long-random-string"
    volumes:
      # SQLite DB + run logs (default --db /data/master-agent.db)
      - ./data:/data
      # Host key verification (OpenSSH GlobalKnownHostsFile)
      - ./ssh/known_hosts:/etc/ssh/ssh_known_hosts:ro
    command: ["daemon", "--http-addr", "0.0.0.0:8080"]
