<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>master-agent — Tasks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>master-agent</h1>
    <nav>
      <a href="/">Projects</a>
      <span class="active">Tasks</span>
      <a href="/runs.html">Runs</a>
    </nav>
    <div id="auth-panel" class="auth-panel hidden">
      <label for="token-input">API token</label>
      <input id="token-input" type="password" placeholder="Bearer token" autocomplete="off">
      <button type="button" id="token-save">Save</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <h2>Tasks</h2>
      <button type="button" id="btn-new" class="primary" disabled>New task</button>
    </section>

    <div class="project-picker">
      <label for="project-select">Project</label>
      <select id="project-select">
        <option value="">Select a project…</option>
      </select>
    </div>

    <div id="flash" class="flash hidden" role="alert"></div>

    <table id="tasks-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Interval</th>
          <th>Enabled</th>
          <th>Last run</th>
          <th>Next run</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tasks-body">
        <tr><td colspan="6" class="muted">Select a project to view tasks.</td></tr>
      </tbody>
    </table>

    <dialog id="task-dialog">
      <form id="task-form" method="dialog">
        <h3 id="dialog-title">New task</h3>
        <input type="hidden" id="task-id">

        <label for="task-name">Name</label>
        <input id="task-name" name="name" required>

        <label for="interval_seconds">Interval (seconds)</label>
        <input id="interval_seconds" name="interval_seconds" type="number" min="1" required>

        <label for="command">Command</label>
        <textarea id="command" name="command" rows="3" required placeholder='cursor agent -p {{prompt}}'></textarea>
        <p class="hint">Shell string or JSON argv array. No SSH fields — connection comes from the project.</p>

        <label for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" rows="4" required></textarea>

        <label class="checkbox">
          <input id="task-enabled" name="enabled" type="checkbox" checked>
          Enabled
        </label>

        <div id="form-error" class="form-error hidden"></div>

        <div class="dialog-actions">
          <button type="button" id="btn-cancel">Cancel</button>
          <button type="submit" class="primary" id="btn-save">Save</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="/tasks.js"></script>
</body>
</html>
