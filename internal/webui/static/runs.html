<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>master-agent — Runs</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>master-agent</h1>
    <nav>
      <a href="/">Projects</a>
      <a href="/tasks.html">Tasks</a>
      <span class="active">Runs</span>
    </nav>
    <div id="auth-panel" class="auth-panel hidden">
      <label for="token-input">API token</label>
      <input id="token-input" type="password" placeholder="Bearer token" autocomplete="off">
      <button type="button" id="token-save">Save</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <h2>Runs</h2>
    </section>

    <div class="filters">
      <div class="filter-field">
        <label for="project-filter">Project</label>
        <select id="project-filter">
          <option value="">All projects</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="status-filter">Status</label>
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="running">running</option>
          <option value="success">success</option>
          <option value="error">error</option>
        </select>
      </div>
    </div>

    <div id="flash" class="flash hidden" role="alert"></div>

    <table id="runs-table">
      <thead>
        <tr>
          <th>Status</th>
          <th>Project</th>
          <th>Task</th>
          <th>Started</th>
          <th>Finished</th>
          <th>Exit</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="runs-body">
        <tr><td colspan="7" class="muted">Loading…</td></tr>
      </tbody>
    </table>

    <dialog id="run-detail-dialog">
      <div id="run-detail">
        <h3>Run detail</h3>
        <dl class="run-meta">
          <dt>Run ID</dt>
          <dd><code id="detail-run-id">—</code></dd>
          <dt>Status</dt>
          <dd id="detail-status">—</dd>
          <dt>Started</dt>
          <dd id="detail-started">—</dd>
          <dt>Finished</dt>
          <dd id="detail-finished">—</dd>
          <dt>Exit code</dt>
          <dd id="detail-exit-code">—</dd>
          <dt>Error</dt>
          <dd id="detail-error" class="detail-error">—</dd>
        </dl>

        <h4>Log</h4>
        <pre id="detail-log" class="log-viewer muted">Loading log…</pre>

        <div class="dialog-actions">
          <button type="button" id="detail-close">Close</button>
        </div>
      </div>
    </dialog>
  </main>

  <script src="/runs.js"></script>
</body>
</html>
