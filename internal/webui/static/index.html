<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>master-agent — Projects</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>master-agent</h1>
    <nav>
      <span class="active">Projects</span>
      <a href="/tasks.html">Tasks</a>
      <a href="/runs.html">Runs</a>
    </nav>
    <div class="header-actions">
      <button type="button" id="btn-logout" class="link">Log out</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <h2>Projects</h2>
      <button type="button" id="btn-new" class="primary">New project</button>
    </section>

    <div id="flash" class="flash hidden" role="alert"></div>

    <table id="projects-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Path</th>
          <th>SSH</th>
          <th>Enabled</th>
          <th>SSH key</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="projects-body">
        <tr><td colspan="6" class="muted">Loading…</td></tr>
      </tbody>
    </table>

    <dialog id="project-dialog">
      <form id="project-form" method="dialog">
        <h3 id="dialog-title">New project</h3>
        <input type="hidden" id="project-id">

        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="path">Remote path</label>
        <input id="path" name="path" required placeholder="/home/user/project">

        <div class="row">
          <div>
            <label for="ssh_host">SSH host</label>
            <input id="ssh_host" name="ssh_host" required>
          </div>
          <div>
            <label for="ssh_port">Port</label>
            <input id="ssh_port" name="ssh_port" type="number" min="1" value="22">
          </div>
        </div>

        <label for="ssh_user">SSH user</label>
        <input id="ssh_user" name="ssh_user" required>

        <label for="ssh_private_key">SSH private key</label>
        <textarea id="ssh_private_key" name="ssh_private_key" rows="8" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
        <p id="key-hint-create" class="hint">Paste the full private key body. It is stored in SQLite and never shown again after save.</p>
        <p id="key-hint-edit" class="hint hidden">Leave empty to keep the existing key. Paste new key material to replace it.</p>

        <label class="checkbox">
          <input id="enabled" name="enabled" type="checkbox" checked>
          Enabled
        </label>

        <div id="form-error" class="form-error hidden"></div>

        <div class="dialog-actions">
          <button type="button" id="btn-cancel">Cancel</button>
          <button type="submit" class="primary" id="btn-save">Save</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="/auth.js"></script>
  <script src="/app.js"></script>
</body>
</html>
